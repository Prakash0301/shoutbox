services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    networks:
      - frontend
    restart: unless-stopped

  web:
    build: .
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - frontend
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:
